[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "osaka"

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@trustline.id/evmsdk/=node_modules/@trustline.id/evmsdk/",
  "forge-std/=lib/forge-std/src/"
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

